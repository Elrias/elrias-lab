<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Abyss Awakening</title>

<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/home.css">

<style>
body {
  background: radial-gradient(circle at top, #0f1220, #070910);
  color: white;
}

/* centre le bloc */
.reset-wrapper {
  max-width: 500px;
  margin: 80px auto;
}

/* bug fixed */

/* fallback si composes non supporté */
.reset-card {
  background: #1b1f2a;
  border-radius: 16px;
  padding: 40px 30px;
  border: 1px solid #2a2f3a;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  text-align: center;
  animation: fadeInUp 0.6s ease forwards;
}

.reset-card h1 {
  margin-bottom: 10px;
}

.reset-card p {
  opacity: 0.7;
  margin-bottom: 25px;
}

/* input */
.reset-card input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #333;
  background: #111;
  color: white;
  margin-bottom: 20px;
}

/* bouton */
.reset-card button {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #6a5cff, #8c78ff);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.reset-card button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(140,120,255,0.4);
}

/* status */
.status {
  margin-top: 20px;
  font-size: 14px;
}

.status.success { color: #6effa3; }
.status.error { color: #ff6e6e; }
</style>
</head>

<body class="theme-dark">

<main class="wiki-content">

  <div class="reset-wrapper">

    <div class="reset-card">
      <h1>Reset your password</h1>
      <p>Enter a new password to continue your journey.</p>

      <form id="resetForm">
        <input
          type="password"
          id="password"
          placeholder="New password"
          required
          minlength="8"
        />
        <button type="submit">Confirm reset</button>
      </form>

      <div id="status" class="status"></div>
    </div>

  </div>

</main>

<script>
const API_BASE = "https://abyssawakening-backend.onrender.com";

const params = new URLSearchParams(window.location.search);
const token = params.get("token");

const form = document.getElementById("resetForm");
const status = document.getElementById("status");

if (!token) {
  status.textContent = "Invalid or missing token.";
  status.className = "status error";
  form.style.display = "none";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const password = document.getElementById("password").value;

  if (password.length < 8) {
    status.textContent = "Password must be at least 8 characters.";
    status.className = "status error";
    return;
  }

  status.textContent = "Resetting password...";
  status.className = "status";

  try {
    const res = await fetch(API_BASE + "/auth/reset-password", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        token,
        newPassword: password
      })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "error");
    }

    status.textContent = "Password successfully reset!";
    status.className = "status success";

  } catch (err) {
    status.textContent = "Error: " + err.message;
    status.className = "status error";
  }
});
</script>

</body>
</html>
