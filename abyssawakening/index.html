<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0" />

    <link rel="icon" href="icon/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon/icon.png" />

    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="index.css" />

    <title>Abyss Awakening</title>
  </head>

  <body>
    <div id="backdrop" aria-hidden="true"></div>

    <!-- Menu -->
    <aside id="sidePanel" aria-label="Menu">
      <div class="panelInner">
        <!-- LOGIN -->
        <div class="panelBlock">
          <div class="panelHeader">
            <h2 id="authTitle">Login</h2>
          </div>

          <form id="authForm" class="authForm" autocomplete="on">
            <div class="fieldRow">
              <label for="authEmail">Email</label>
              <input
                id="authEmail"
                type="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
              />
            </div>

            <div class="fieldRow">
              <label for="authPassword">Password</label>
              <input
                id="authPassword"
                type="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
              />
            </div>

            <div class="authActions">
              <button type="button" class="primaryBtn" id="authSubmitBtn">Login</button>

              <!-- Logout (affiché seulement quand connecté) -->
              <button
                type="button"
                class="primaryBtn secondaryBtn"
                id="authLogoutBtn"
                style="display:none;"
              >
                Logout
              </button>
            </div>

            <div class="authLinks" id="authLinksRow">
              <button type="button" class="linkBtn" id="authToggleModeBtn">Register</button>
              <button type="button" class="linkBtn" id="authForgotBtn">Forgot password?</button>
            </div>
          </form>
        </div>

        <!-- GUIDES -->
        <div class="panelBlock panelBlockGrow">
          <h2>Guides</h2>
          <div class="guidesList">
            <a href="wiki/battle.html" target="_blank" class="guideLink">Battle</a>
            <a href="wiki/characters.html" target="_blank" class="guideLink">Characters</a>
            <a href="wiki/enemies.html" target="_blank" class="guideLink">Enemies</a>
            <a href="wiki/stats.html" target="_blank" class="guideLink">Stats</a>
            <a href="wiki/equipment.html" target="_blank" class="guideLink">Equipment</a>
            <a href="wiki/states.html" target="_blank" class="guideLink">States</a>
            <a href="wiki/account.html" target="_blank" class="guideLink">Account</a>
          </div>
        </div>

        <!-- VERSION -->
        <div class="panelBlock panelFooter">
          <h2>Abyss Awakening</h2>
          <p class="muted">Demo v0.3.0</p>
        </div>
      </div>
    </aside>

    <!-- Bouton Menu -->
    <button
      id="menuToggle"
      class="ui-btn"
      type="button"
      aria-expanded="false"
      aria-controls="sidePanel"
    >
      <span id="menuIcon">☰</span>
      <span id="menuLabel">Menu</span>
    </button>

    <!-- Bouton Fullscreen -->
    <button id="fullscreenBtn" type="button" aria-label="Plein écran">
      <img src="./img/system/fullscreen_icon.png" alt="Fullscreen" />
    </button>

    <!-- Le jeu -->
    <script src="js/main.js"></script>

    <!-- JS du site -->
    <script src="index.js"></script>

    <!-- Discord -->
    <a
      id="discordBtn"
      class="floatingDiscord"
      href="https://discord.gg/P97QCCqqMh"
      target="_blank"
      rel="noopener"
      aria-label="Rejoindre le Discord"
    >
      <span class="discordDot" aria-hidden="true"></span>
      <span class="discordLabel">Discord</span>
    </a>
  </body>
</html>
