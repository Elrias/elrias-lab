<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>

<div id="profile">

  <!-- HEADER -->
  <div id="header">
    <img id="avatar">
    <div>
      <div class="profile-name">
        <span id="username"></span>
        <button id="edit-username-btn">✏️</button>
      </div>
      <div class="profile-title">
        <span id="active-title"></span>

        <select id="title-select"></select>
      </div>
    </div>
    <div id="score"></div>
  </div>

  <!-- CONTENT -->
  <div id="content">

    <!-- LEFT -->
    <div id="left">

      <div id="main-character"></div>

      <div id="party"></div>

    </div>

    <!-- RIGHT -->
    <div id="right">
      <h2>Achievements</h2>
      <div id="achievements"></div>
    </div>

  </div>

</div>

<script src="profile.js"></script>
</body>
</html>
